name: wake-relay

# STAGE 1 of the review-wake relay. Triggered by pull_request_review, which for a
# FORK PR has NO access to repo secrets — so this stage does only the secret-free
# work: extract the wake payload + non-secret endpoint marker and upload it as an
# artifact. STAGE 2 (wake-relay-sign, on workflow_run) holds the signing key and
# does the sign+POST. See .github/wake_prepare.py and
# jaato-client-telegram/docs/design/pr-review-feedback-loop.md.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Trusted base code only (never the PR head / fork code).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: extract wake payload
        run: python .github/wake_prepare.py
      - name: upload wake payload
        if: ${{ hashFiles('wake_payload.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wake-payload
          path: wake_payload.json
          retention-days: 1
