name: wake-relay

# When a reviewer submits a review on a contributed-tool PR, sign a wake and POST
# it to the contributing bot's daemon so the bot's session is woken to address the
# feedback. See .github/wake_relay.py and
# jaato-client-telegram/docs/design/pr-review-feedback-loop.md.
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch: {}   # TEMP: manual trigger to diagnose the signing-secret shape

# Read-only token; the relay authenticates to the daemon with the store's signing
# key (STORE_WAKE_PRIVKEY secret), not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      # SECURITY: pull_request_review runs with repo secrets in scope, so we check
      # out the TRUSTED base branch (never the PR head / fork code) and only run the
      # base-repo relay script. We never execute fork-supplied code with the secret.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - name: DIAG secret shape (temp)
        env:
          K: ${{ secrets.STORE_WAKE_PRIVKEY }}
        run: |
          python - <<'PY'
          import os, base64
          v = os.environ["K"]
          print("len:", len(v))
          print("prefix:", repr(v[:20]))
          print("suffix:", repr(v[-10:]))
          print("contains newline:", "\n" in v, "| contains dash:", "-" in v)
          try:
              d = base64.b64decode(v)
              print("b64decode -> OK, decoded_len:", len(d), "decoded_prefix:", d[:18])
          except Exception as e:
              print("b64decode -> FAIL:", type(e).__name__, str(e)[:60])
          PY
      - name: sign + POST wake
        env:
          STORE_WAKE_PRIVKEY: ${{ secrets.STORE_WAKE_PRIVKEY }}
        run: python .github/wake_relay.py
